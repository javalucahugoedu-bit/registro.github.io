<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <!-- reCAPTCHA -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    body {
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }
    .card {
      background: white;
      width: 450px;
      padding: 40px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      border: 1px solid #e0e0e0;
      box-sizing: border-box;
    }
    h2 {
      text-align: center;
      font-weight: 500;
      color: #2c3e50;
      margin-bottom: 30px;
    }
    label {
      font-size: 13px;
      color: #555;
      display: block;
      margin-top: 20px;
      margin-bottom: 5px;
    }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      border: none;
      border-bottom: 1px solid #ccc;
      padding: 8px 0;
      outline: none;
      font-size: 14px;
      background: transparent;
      box-sizing: border-box;
    }
    input:focus {
      border-bottom: 2px solid #3b82f6;
    }
    .g-recaptcha-container {
      margin-top: 25px;
      display: flex;
      justify-content: center;
    }
    .btn {
      margin-top: 20px;
      width: 100%;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
    }
    .btn:hover {
      background: #2563eb;
    }
    .link-container {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }
    .link-container a {
      color: #3b82f6;
      text-decoration: none;
    }
    .link-container a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Crear Cuenta</h2>

  <form id="form-registro">
    <div class="field">
      <label for="name">Nombre completo</label>
      <input type="text" name="name" id="name" required>
    </div>

    <div class="field">
      <label for="title">Usuario</label>
      <input type="text" name="title" id="title" required>
    </div>

    <div class="field">
      <label for="email">Correo electrónico</label>
      <input type="email" name="email" id="email" required>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" name="password" id="password" required>
    </div>

    <!-- Contenedor del reCAPTCHA oficial -->
    <div class="g-recaptcha-container">
      <div class="g-recaptcha" data-sitekey="6LeJifotAAAAAOoZi-SOw4AXStn4JoIx1EIQxsTH"></div>
    </div>

    <input type="submit" class="btn" id="button" value="Registrarse">
  </form>

  <div class="link-container">
    ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>
  </div>
</div>

<!-- Lógica de Firebase para Registro -->
<script type="module">
  // Importar las funciones necesarias de Firebase SDK
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

  // Configuración de Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyDDpoSGB3MV54_EBZF1FNDH0c2n4ITpOaA",
    authDomain: "tp2login-f522c.firebaseapp.com",
    projectId: "tp2login-f522c",
    storageBucket: "tp2login-f522c.firebasestorage.app",
    messagingSenderId: "291524845117",
    appId: "1:291524845117:web:61d0e3da6c961626a05454",
    measurementId: "G-PC8E2J3LGK"
  };

  // Inicializar Firebase, Auth y Firestore
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const btn = document.getElementById('button');
  const form = document.getElementById('form-registro');

  form.addEventListener('submit', async function(event) {
    event.preventDefault();

    const name = document.getElementById('name').value;
    const username = document.getElementById('title').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    btn.value = 'Registrando...';

    try {
      // 1. Crear el usuario en Firebase Authentication
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // 2. Guardar los datos adicionales (nombre y usuario) en Cloud Firestore
      await setDoc(doc(db, "usuarios", user.uid), {
        nombre: name,
        usuario: username,
        correo: email,
        createdAt: new Date()
      });

      btn.value = 'Registrarse';
      alert('¡Registro exitoso en Firebase!');
      form.reset();
      
      // Opcional: Redirigir al usuario al login o dashboard
      // window.location.href = "login.html";

    } catch (error) {
      btn.value = 'Registrarse';
      console.error("Error en el registro:", error);
      alert('Hubo un error: ' + error.message);
    }
  });
</script>

</body>
</html>
